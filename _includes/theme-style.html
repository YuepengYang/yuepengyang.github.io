<style>
  :root {
    --ink: #19212a;
    --muted: #657080;
    --line: #d8dee6;
    --paper: #f7f8f5;
    --panel: #ffffff;
    --blue: #235789;
    --green: #3d6b5a;
    --red: #a04538;
    --shadow: 0 18px 45px rgba(31, 42, 55, 0.09);
    --max: 1160px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--paper);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.58;
  }

  a {
    color: var(--blue);
    text-decoration: none;
    text-underline-offset: 3px;
  }

  a:hover { text-decoration: underline; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(247, 248, 245, 0.91);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(16px);
  }

  .topbar-inner {
    max-width: var(--max);
    margin: 0 auto;
    display: flex;
    justify-content: flex-end;
    padding: 14px 26px;
  }

  nav {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 650;
  }

  nav a { color: #2f3945; }
  nav a[aria-current="page"] { color: var(--green); }

  .hero {
    max-width: var(--max);
    margin: 0 auto;
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 42px;
    padding: 48px 26px 34px;
  }

  .profile {
    align-self: start;
    position: sticky;
    top: 82px;
  }

  .portrait {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: var(--shadow);
    background: #e4e7ea;
    display: block;
  }

  .profile h1 {
    margin: 15px 0 4px;
    font-size: 24px;
    line-height: 1.05;
    letter-spacing: 0;
  }

  .profile .cn {
    margin: 0 0 15px;
    color: var(--muted);
    font-size: 17px;
  }

  .profile p {
    margin: 0 0 4px;
    color: #374151;
    font-size: 15px;
  }

  .profile-links {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 14px;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: 700;
  }

  .profile-links a {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 6px 10px;
    background: var(--panel);
    color: #28313d;
  }

  .intro { padding-top: 6px; }

  .intro-copy {
    max-width: 760px;
    margin: 0;
    color: #2f3945;
    font-size: 18px;
  }

  .intro-copy + .intro-copy { margin-top: 16px; }

  .job-market {
    margin-top: 22px;
    padding: 13px 16px;
    border-left: 3px solid var(--green);
    border-radius: 0 5px 5px 0;
    background: #edf3ef;
    color: var(--green);
    font-size: 17px;
  }

  .job-market p { margin: 0; }

  .intro #news { margin-top: 22px; }
  .intro #news .section-head {
    margin-bottom: 10px;
    padding-bottom: 7px;
  }
  .intro #news h2 { font-size: 18px; }

  .content-band {
    border-top: 1px solid var(--line);
    background: #ffffff;
  }

  .main-grid {
    max-width: var(--max);
    margin: 0 auto;
    display: block;
    padding: 34px 26px 62px;
  }

  section + section { margin-top: 42px; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
    padding-bottom: 10px;
  }

  h1, h2, h3, h4 { letter-spacing: 0; }

  h2 {
    margin: 0;
    font-size: 23px;
    line-height: 1.2;
  }

  .section-head a {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: 750;
  }

  .publication {
    display: grid;
    grid-template-columns: 104px minmax(0, 1fr);
    gap: 22px;
    padding: 22px 0;
    border-bottom: 1px solid #e7ebef;
  }

  .venue {
    align-self: start;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--green);
    background: var(--panel);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    font-weight: 800;
    padding: 5px 8px;
    text-align: center;
  }

  .publication h3 {
    margin: 0 0 6px;
    font-size: 21px;
    line-height: 1.28;
  }

  .home-publications .publication {
    grid-template-columns: 92px minmax(0, 1fr);
    gap: 18px;
    padding: 13px 0;
  }

  .intro .home-publications .section-head {
    margin-bottom: 10px;
    padding-bottom: 7px;
  }

  .intro .home-publications h2 {
    font-size: 18px;
  }

  .home-publications .publication h3 {
    margin: 0;
    font-size: 17px;
    line-height: 1.35;
    font-weight: 700;
  }

  .home-publications .venue {
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--green);
    padding: 0;
    text-align: left;
    text-transform: uppercase;
  }

  .home-publications .authors,
  .home-publications .meta {
    font-size: 14px;
  }

  .home-publications .paper-links {
    margin-top: 4px;
    font-size: 13px;
  }

  .authors,
  .meta {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
  }

  .paper-links,
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: 720;
  }

  .news-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .news-list li {
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr);
    gap: 18px;
    padding: 13px 0;
    border-bottom: 1px solid #e7ebef;
  }

  .date {
    color: var(--red);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .page {
    max-width: 1060px;
    margin: 0 auto;
    padding: 54px 26px 72px;
  }

  .page-head {
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
    padding-bottom: 24px;
  }

  .eyebrow {
    margin: 0 0 10px;
    color: var(--green);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .page-head h1 {
    margin: 0;
    font-size: 42px;
    line-height: 1.08;
  }

  .page-head p {
    max-width: 720px;
    margin: 13px 0 0;
    color: #374151;
    font-size: 18px;
  }

  footer {
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    padding: 22px 26px 36px;
    text-align: center;
    background: var(--paper);
  }

  @media (max-width: 860px) {
    .topbar-inner {
      align-items: flex-start;
      flex-direction: column;
      gap: 12px;
    }

    .hero {
      grid-template-columns: 1fr;
      gap: 28px;
      padding-top: 34px;
    }

    .profile {
      position: static;
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 18px;
    }

    .portrait { aspect-ratio: 1; }
    .profile h1 { margin-top: 0; }
    .profile-links { grid-column: 1 / -1; }
  }

  @media (max-width: 560px) {
    .topbar-inner,
    .hero,
    .main-grid,
    .page {
      padding-left: 18px;
      padding-right: 18px;
    }

    nav { gap: 12px; }
    .profile { grid-template-columns: 86px minmax(0, 1fr); }

    .intro-copy,
    .page-head p {
      font-size: 17px;
    }

    .page-head h1 { font-size: 35px; }

    .publication,
    .home-publications .publication,
    .news-list li {
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .venue { justify-self: start; }
  }
</style>
